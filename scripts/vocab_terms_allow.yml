# accept.txt entries whose lowercase form is an ordinary English word, but whose
# capitalised brand casing is enforced on purpose: Vale.Terms flags the lowercase
# spelling in consumer prose. Read by scripts/check_vocab_terms.py (task vocab:check);
# an entry here that no longer forces any word fails the check.
allow:
  "Anthropic('s)?": the company name; lowercase "anthropic" is rare in technical prose
  Bun: the JavaScript runtime; lowercase "bun" is rare in technical prose
  Gemma: the model family; lowercase "gemma" is rare in technical prose
  Renovate: the dependency bot; its CLI name stays lowercase inside code spans
  Tailwind: the CSS framework; lowercase "tailwind" is rare in technical prose
